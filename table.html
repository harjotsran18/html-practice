<!DOCTYPE html>
<html>
<head>
    <title>Table</title>
</head>
<body>
    <table border="2">
        <tr>
            <th>NAME</th>
            <th>AGE</th>
            <th>COUNTRY</th>
        </tr>
        <tr>
            <td>Harry</td>
            <td>28</td>
            <td>Britain</td>
        </tr>
        <tr>
            <td>John</td>
            <td>35</td>
            <td>USA</td>
        </tr>
        <tr>
            <td>Ram</td>
            <td>19</td>
            <td>Nepal</td>
        </tr>
    </table>
    <br>
    <br>
    <br>
    <table border="2">
        <tr>
            <th>S.no</th>
            <th>Item</th>
            <th>Quantity</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Apple</td>
            <td>2</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Mango</td>
            <td>2</td>
        </tr>
        <tr>
            <td>3</td>
            <td>Orange</td>
            <td>1</td>
        </tr>
        <tr>
            <td colspan="2">TOTAL</td>
            <td>5</td>
        </tr>
    </table>
    <br><br><br>
    <table border="2">
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Marks</th>
        </tr>
        <tr>
            <td rowspan="3">Mark Smith</td>
            <td>English</td>
            <td>67</td>
        </tr>
        <tr>
            <td>Maths</td>
            <td>82</td>
        </tr>
        <tr>
            <td>Science</td>
            <td>91</td>
        </tr>
    </table>
</body>
</html>
