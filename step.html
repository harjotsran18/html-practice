<!DOCTYPE html>
<html>
<head>
    <title>step</title>
</head>
<body>
    <form>
        <label for="marks">Enter marks : </label>
        <input type="number" step="4">
        <br><br>
        <label for="email">Enter email</label>
        <input type="email">
        <br><br>
        <label for="username">Username : </label>
        <input type="text" pattern="[A-Za-z]+" title="only letters accepted" name="us" id="username" placeholder="Enter letters only">
        <br><br>
        <label for="password">Enter password :  </label>
        <input type="password" name="ps" id="password" pattern="[A-Za-z0-9](8,10)">
        <br><br>
        <input type="submit">
        <br><br>

    </form>
</body>
</html>
