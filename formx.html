<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <label for="name">Enter name</label>
        <input type="text" name="name" id="name" placeholder="enter the name"><br><br>
        <label for="email">Enter the email</label>
        <input type="email" name="email" id="email" placeholder="enter thr email"><br><br>
        <label for="age">Enter age</label>
        <input type="age" name="age" id="age" min="5" max="18"><br><br>
        <label for="roll no">Roll number</label>
        <input type="number" name="roll number" id="roll number" pattern="[A-Za-z]{2}[0-9]{3}"><br><br>
        <label for="password">Enter password</label>
        <input type="password" name="password" id="password" pattern="[0-9]{6,}"><br><br>
        <input type="submit" value="Submit">



    </form>
</body>
</html>
