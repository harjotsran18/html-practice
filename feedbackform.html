<!DOCTYPE html>
<html>
<head>
    <title>Student feedback form</title>
</head>
<body>
    <h2>Student Feedback Form</h2>
    <form>
        <table>
            <tr>
                <td><label for="username">Name:</label></td>
                <td><input type="text" id="username" name="username" placeholder="enter your name" required></td>
            </tr>    
            <tr>
                <td><label for="email">Email:</label></td>
                <td><input type="email" name="email" placeholder="enter your email id" required></td>
            </tr>
            <tr>
                <td><label for="password">Password</label></td>
                <td><input type="password" name="password" id="password" placeholder="password" required minlength="8" maxlength="12"></td>
            </tr>
            <tr>
                <td><label for="age">Age:</label></td>
                <td><input type="number" name="age" id="age" placeholder="enter age" required min="15" max="35"></td>
            </tr>
            <tr>
                <td><label for="gender">Gender</label> </td>
                <td><input type="radio" name="gender" id="male"><label for="male">Male</label>
                <input type="radio" name="gender" id="female"><label for="female">Female</label>
                <input type="radio" name="gender" id="other" disabled><label for="other">Other</label></td>
            </tr>
            <tr>
                <td><label for="subjects">Subjects interested:</label></td>
            </tr>
            <tr>
                <td><input type="checkbox" name="HTML" id="html"><label for="html">HTML</label>
                <input type="checkbox" name="CSS" id="css"><label for="css">CSS</label>
                <input type="checkbox" name="JavaScript" id="JS"><label for="JS">JavaScript</label>
                <input type="checkbox" name="Java" id="java" checked><label for="java">Java</label></td>
            </tr>
            <tr><td></td></tr>
            <tr>
                <td><label for="department">Department:</label></td>
                <td><select name="city" id="department">
                    <option>CSE</option>
                    <option>Electronics</option>
                    <option>Mechanical</option>
                    <option>Aerospace</option>
                </select></td>
            </tr>
            </table>
            <br>
             <label for="feedback">Enter your feedback:</label><br>
        <textarea name="" id="" rows="4" cols="60" placeholder="Enter feedback"></textarea>
        <br><br>
        <label for="date">Date of submission</label>
        <input type="date" name="date" id="date" placeholder="" required>
        <br><br>
        <label for="satisfaction">Satisfaction(1-10):</label>
        <input type="range" id="satisfaction" name="satisfaction" min="0" max="10">
        <br><br>
        <label for="resume">Upload Assignment</label>
        <input type="file" name="resume" id="resume" required>
        <br><br>
        <button type="reset">Reset</button>
        <button type="submit">Submit</button>
        <button type="Click me">Click me</button>
    </form>
</body>
</html>
